[project]
name = "msmcp"
version = "0.1.0"
description = "Model Context Protocol server for computational mass spectrometry"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.0.0",
    "massflow>=0.1.0",
    "pydantic>=2.12.5",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]
dev = [
    "msmcp[test]",
    "ruff>=0.11",
    "mypy>=1.15",
    "basedpyright>=1.16",
]
# Optional real cheminformatics: enables RDKit-backed SMILES → formula
# conversion in `annotate_isotopes` (install with `uv sync --extra chem`;
# without it, the tool falls back to a small static lookup table).
chem = [
    "rdkit>=2024.3",
]
# Optional ML extras: real spectral foundation-model inference.  The DreaMS
# package itself is not on PyPI (the `dreams` name is an unrelated
# nanophotonics library); install it from source with
# `uv pip install "git+https://github.com/pluskal-lab/DreaMS.git"`.
ml = [
    "torch>=2.1",
]

[project.scripts]
msmcp = "msmcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-ra` shows a summary of skips/failures; the `eval` marker is excluded here so
# `make test` stays a fast unit run.  `make eval` (or an explicit `-m eval` on
# the command line, which wins over addopts) runs the notebook suite.
addopts = "-ra -m 'not eval'"
asyncio_mode = "auto"
markers = [
    "eval: executes notebooks/eval_msmcp.ipynb end to end (slow; run via `make eval`)",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]
# Not source code, so not in the gate: the design-log markdown (it embeds
# Python snippets) and the gitignored `drafts/` scratch directory, which holds
# audit probes and one-off scripts from concurrent work.
extend-exclude = ["docs/mcp-server-configuration.md", "drafts/"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells run setup (environment flags, sys.path bootstrap) *before*
# importing the package under test, so `import msmcp` cannot sit at the top of
# a cell.  The notebook is otherwise lint-, format- and type-clean, and
# `make eval` executes it end to end.
"notebooks/*.ipynb" = ["E402"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
# The installed package is `msmcp` (src-layout); resolve `msmcp.*` imports
# against the src/ tree.
mypy_path = ["src"]
explicit_package_bases = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Optional / missing runtime modules without type stubs.
module = ["rdkit", "massflow.*", "torch"]
ignore_missing_imports = true

[tool.basedpyright]
# Mirrors the defaults of the Zed language server so `make lint` catches the
# same error classes (import cycles, missing imports, abstract instantiation)
# that the editor reports.  No warnings are tolerated as "debt": src/, tests/
# and the evaluation notebook all check clean at this setting.
typeCheckingMode = "standard"
pythonVersion = "3.13"
# The gitignored `drafts/` scratch directory is not part of the gate: it holds
# audit probes and one-off scripts, including from concurrent work, and linting
# it would fail the build on code that is never shipped.
#
# NOTE: pyright's `exclude` REPLACES its defaults rather than extending them
# (`**/node_modules`, `**/__pycache__`, `**/.*`), so they are restated here.
# Dropping them makes the checker walk `.venv` and `.git` and the run does not
# finish.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "drafts"]
